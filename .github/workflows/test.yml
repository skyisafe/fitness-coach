name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check (no bytecode written)
        run: python3 -c "compile(open('tests/test.py').read(), 'tests/test.py', 'exec')"
      - name: Run structural tests
        run: python3 tests/test.py
